schema_version = "1.0.0"
id = "differt_bridge"
version = "0.6.3"
name = "DiffeRT-Bridge"
tagline = "Run DiffeRT radio simulations beside your Sionna workflow"
maintainer = "Felipe Oliveira Ribas"
type = "add-on"
