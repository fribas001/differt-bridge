schema_version = 1
# Entry points retain their original paths: historical evidence hashes them.
# Prerequisites are the declared entry prerequisites, not a complete cache lock.

[[study]]
id = "diffraction"
title = "Native diffraction fixtures and isolated Sionna candidates"
portability = "generated-fixtures"
report = "docs/diffraction.md"
entrypoints = ["scripts/run_diffraction.py"]
prerequisites = []

[[study]]
id = "dielectric"
title = "Dielectric reciprocity and boundary survey"
portability = "workspace-study"
report = "docs/dielectric-diffraction.md"
entrypoints = ["scripts/run_dielectric.py", "scripts/analyze_dielectric.py", "scripts/build_dielectric_report.py"]
prerequisites = []

[[study]]
id = "reciprocity"
title = "Reciprocal corrections and independent Maxwell controls"
