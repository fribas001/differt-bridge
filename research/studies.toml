report = "docs/dielectric-corrections.md"
entrypoints = ["scripts/run_maxwell_reference.py", "scripts/analyze_reciprocal_limits.py", "scripts/build_reciprocal_report.py"]
prerequisites = []

[[study]]
id = "model-errors"
title = "Diffraction model errors against Maxwell"
portability = "workspace-study"
report = "docs/diffraction-model-errors.md"
entrypoints = ["scripts/run_model_error_reference.py", "scripts/analyze_model_errors.py", "scripts/build_model_error_report.py"]
prerequisites = []

[[study]]
id = "maxwell-2d"
