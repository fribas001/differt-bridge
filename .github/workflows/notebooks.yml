name: Research notebooks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  replay:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-notebooks.txt
      - run: python -m pip install -r requirements-notebooks.txt pytest
      - run: python -m pytest tests/test_notebook_data.py tests/test_notebook_visuals.py
      - run: python scripts/execute_notebooks.py
      - uses: actions/upload-artifact@v4
        with:
          name: research-notebooks-${{ matrix.os }}
          path: build/notebooks/
