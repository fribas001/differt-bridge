name: Portable checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest
      - run: python -m unittest discover -s src/differt_bridge/tests -p 'test_*.py'
      - run: node src/differt_bridge/tests/test_report_math.cjs
      - run: python scripts/check_release.py
      - run: python scripts/build_extension.py
      - uses: actions/upload-artifact@v4
        with:
          name: blender-extension
          path: dist/*
